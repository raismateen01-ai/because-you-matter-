<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Please Forgive Me 💗</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:"Trebuchet MS",sans-serif;
  background:linear-gradient(135deg,#ffdce9,#fff4f8,#ffd6e5);
  overflow:hidden;
}

.card{
  width:90%;
  max-width:430px;
  padding:30px 25px 40px;
  text-align:center;
  background:rgba(255,255,255,.9);
  border:2px solid rgba(255,150,185,.3);
  border-radius:35px;
  box-shadow:0 15px 45px rgba(160,50,90,.15);
  position:relative;
}

.card:before,
.card:after{
  content:"♡";
  position:absolute;
  color:#ff8fb5;
  font-size:28px;
}

.card:before{top:18px;left:25px}
.card:after{bottom:18px;right:25px}

.flower{
  font-size:100px;
  margin:5px 0 5px;
  animation:float 2.5s ease-in-out infinite;
  filter:drop-shadow(0 8px 8px rgba(200,80,120,.18));
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

h1{
  color:#8b2855;
  font-size:31px;
  line-height:1.3;
  margin:8px 0 15px;
}

.line{
  color:#ff82aa;
  font-size:24px;
  margin:10px 0 18px;
}

p{
  color:#71324f;
  font-size:18px;
  line-height:1.7;
}

.hearts{
  color:#ff6f9f;
  font-size:27px;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="card">

  <div class="flower">🌷</div>

  <h1>Please Forgive Me<br>🤧💗💗</h1>

  <div class="line">♡ ───── ♡ ───── ♡</div>

  <p>
    I'm truly sorry. 🥺💗<br>
    I hope this little flower<br>
    can bring a smile to you. 🌷<br><br>

    You mean a lot to me. 💗
  </p>

  <div class="hearts">♡ ✨ 💗 ✨ ♡</div>

</div>

</body>
</html>
