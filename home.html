<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Favorite Person 💗</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:"Trebuchet MS",sans-serif;
  background:linear-gradient(135deg,#ffdce9,#fff4f8,#ffd6e5);
  overflow:hidden;
}

.card{
  width:90%;
  max-width:430px;
  padding:35px 25px;
  text-align:center;
  background:rgba(255,255,255,.9);
  border:2px solid rgba(255,150,185,.3);
  border-radius:35px;
  box-shadow:0 15px 45px rgba(160,50,90,.15);
  position:relative;
}

.card:before,
.card:after{
  content:"♡";
  position:absolute;
  color:#ff8fb5;
  font-size:28px;
}

.card:before{top:18px;left:25px}
.card:after{bottom:18px;right:25px}

h1{
  color:#8b2855;
  font-size:31px;
  line-height:1.25;
  margin:10px 0 20px;
}

p{
  color:#71324f;
  font-size:18px;
  line-height:1.7;
}

.line{
  color:#ff82aa;
  font-size:24px;
  margin:15px 0;
}

button{
  margin-top:20px;
  padding:15px 35px;
  border:none;
  border-radius:35px;
  background:linear-gradient(135deg,#ff76a6,#ff9fbd);
  color:white;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 8px 20px rgba(255,100,150,.35);
  cursor:pointer;
}

button:hover{
  transform:scale(1.06);
}
</style>
</head>

<body>

<div class="card">

  <div style="font-size:30px;">♡</div>

  <h1>Because You<br> Matter To Me 💗</h1>

  <div class="line">♡ ───── ♡ ───── ♡</div>

  <p>
    I'm really sorry. 🥺💗<br>
    I never wanted to hurt you<br>
    or make you feel bad.<br><br>

    You are really special to me,<br>
    and I hope you can forgive me. 💕
  </p>

  <button onclick="window.location.href='forgive.html'">
    Tap Here →
  </button>

</div>

</body>
</html>
