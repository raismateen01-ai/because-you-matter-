<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise 💗</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:"Trebuchet MS",sans-serif;
  background:linear-gradient(135deg,#ffdce9,#fff4f8,#ffd6e5);
}

.card{
  width:90%;
  max-width:420px;
  padding:40px 25px;
  text-align:center;
  background:rgba(255,255,255,.9);
  border-radius:35px;
  box-shadow:0 15px 45px rgba(160,50,90,.15);
}

.heart{
  font-size:70px;
  margin-bottom:10px;
}

h1{
  color:#8b2855;
  font-size:30px;
}

p{
  color:#71324f;
  font-size:17px;
}

input{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:2px solid #ffc0d5;
  border-radius:25px;
  outline:none;
  text-align:center;
  font-size:18px;
}

button{
  margin-top:18px;
  padding:14px 35px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,#ff76a6,#ff9fbd);
  color:white;
  font-size:18px;
  font-weight:bold;
}

#error{
  color:#e75480;
  margin-top:15px;
  display:none;
}
</style>
</head>

<body>

<div class="card">

  <div class="heart">💗</div>

  <h1>A Little Surprise</h1>

  <p>Enter the secret password 💕</p>

  <input
    type="password"
    id="password"
    placeholder="Enter password"
  >

  <button onclick="checkPassword()">Unlock 💗</button>

  <p id="error">Wrong password 🥺 Try again.</p>

</div>

<script>
function checkPassword(){

  const password = document.getElementById("password").value;

  if(password === "أُحِبُّكَ"){
    window.location.href = "home.html";
  }else{
    document.getElementById("error").style.display = "block";
  }

}
</script>

</body>
</html>
